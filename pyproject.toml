[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcrnet"
version = "0.1.0"
description = "Budgeted Contextual Refinement Network for extensible RGB object detection research"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy>=1.26", "Pillow>=10", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
data = ["opencv-python-headless>=4.10", "pycocotools>=2.0.8"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
bcrnet = "bcrnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
